name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: lexuz
          POSTGRES_PASSWORD: lexuz
          POSTGRES_DB: lexuz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lexuz" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # No AI provider or Lex.uz access in CI: tests use fixtures and a fake LLM.
      TEST_DATABASE_URL: postgresql+psycopg://lexuz:lexuz@127.0.0.1:5432/lexuz_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql+psycopg://lexuz:lexuz@127.0.0.1:5432/lexuz
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations (upgrade → schema check → downgrade → upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests (unit + integration with PostgreSQL/pgvector and Redis)
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lexuz-rag:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
